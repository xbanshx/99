name: SEO & GEO Guard (Googlebot + Bingbot)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly live production health check every Monday at 05:00 UTC (08:00 AM KSA)
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit target"
        required: false
        default: "live"
        type: choice
        options:
          - live
          - local

jobs:
  seo-geo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright & Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run SEO & GEO Guard (Local Rendered DOM)
        if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'local')
        run: python scripts/seo_geo_guard.py

      - name: Run SEO & GEO Guard (Live Production https://www.i99.sa)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
        run: python scripts/seo_geo_guard.py --live
